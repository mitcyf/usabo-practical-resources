<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reverse Complement | USABO Practical Resources</title>
  <link rel="stylesheet" href="../../../assets/site.css">
  <script defer src="../../../assets/site-stripes.js"></script>
</head>
<body data-py-tool="reverse-complement">
  <main class="site-shell">
    <header class="site-header">
      <p class="site-title"><a href="../../../">USABO Practical Resources</a></p>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="../../../camp-resources/">Camp Resources</a>
        <a href="../../../plant-computation-biology/">Plant Computation Biology</a>
      </nav>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../../../">Home</a> / <a href="../../">Camp Resources</a> / <a href="../">IBO Practical Tools</a> / Reverse Complement</nav>

    <h1>Reverse Complement</h1>
    <section class="panel" aria-label="Reverse Complement inputs">
      <label for="sequence-input">DNA sequence or FASTA</label>
      <textarea id="sequence-input" spellcheck="false"></textarea>
      <div class="buttons">
        <button type="button" id="run-tool">Generate reverse complement</button>
        <button type="button" class="secondary" id="clear-tool">Clear</button>
        <button type="button" class="secondary" id="copy-results">Copy results</button>
      </div>
<div id="tool-message" class="message" role="status" aria-live="polite"></div>
    </section>
    <section id="tool-results" class="panel" style="display: none;" aria-label="Reverse Complement results">
      <h2>Results</h2>
      <div id="summary" class="summary-grid"></div>
      <div id="output" class="output-block"></div>
      <div id="result-table"></div>
    </section>

    <script src="../../../assets/biopython-tools.js"></script>
  </main>
</body>
</html>
