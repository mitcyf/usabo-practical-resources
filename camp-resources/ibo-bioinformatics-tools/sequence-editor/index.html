<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sequence Editor | USABO Practical Resources</title>
  <link rel="stylesheet" href="../../../assets/site.css?v=proctor-stripes-3">
  <script defer src="../../../assets/site-stripes.js?v=proctor-stripes-3"></script>
</head>
<body>
  <main class="site-shell">
    <header class="site-header">
      <p class="site-title"><a href="../../../">USABO Practical Resources</a></p>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="../../../camp-resources/">Camp Resources</a>
        <a href="../../../plant-computation-biology/">Plant Computation Biology</a>
      </nav>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../../../">Home</a> / <a href="../../">Camp Resources</a> / <a href="../">IBO Practical Tools</a> / Sequence Editor</nav>

    <h1>Sequence Editor</h1>
    <section class="panel sequence-editor-simple">
      <label for="sequence">Enter sequence</label>
      <textarea id="sequence" name="sequence" rows="5" spellcheck="false"></textarea>

      <h2>Selection Information:</h2>
      <h3 class="monospace">Length: <span id="length"></span></h3>
      <h3 class="monospace">Start: <span id="start"></span></h3>
      <h3 class="monospace">End: <span id="end"></span></h3>
    </section>
  </main>

  <script>
    const sequenceArea = document.getElementById("sequence");
    const lengthDisplay = document.getElementById("length");
    const startDisplay = document.getElementById("start");
    const endDisplay = document.getElementById("end");

    sequenceArea.addEventListener("mouseup", updateSelection);
    sequenceArea.addEventListener("keyup", updateSelection);

    function updateSelection() {
      const selectedTextBefore = sequenceArea.value.substring(0, sequenceArea.selectionStart);
      const newlineCount = (selectedTextBefore.match(/\n/g) || []).length;
      const selectedText = sequenceArea.value.substring(sequenceArea.selectionStart, sequenceArea.selectionEnd).replace(/\n/g, "");
      const length = selectedText.length;
      const start = sequenceArea.selectionStart - newlineCount;
      const end = start + length - 1;

      lengthDisplay.textContent = length;
      startDisplay.textContent = start;
      endDisplay.textContent = end;
    }
  </script>
</body>
</html>
