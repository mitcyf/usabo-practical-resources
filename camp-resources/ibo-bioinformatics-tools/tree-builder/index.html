<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree Builder | USABO Practical Resources</title>
  <link rel="stylesheet" href="../../../assets/site.css">
  <script defer src="../../../assets/site-stripes.js"></script>
</head>
<body data-py-tool="tree-builder">
  <main class="site-shell">
    <header class="site-header">
      <p class="site-title"><a href="../../../">USABO Practical Resources</a></p>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="../../../camp-resources/">Camp Resources</a>
        <a href="../../../plant-computation-biology/">Plant Computation Biology</a>
      </nav>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../../../">Home</a> / <a href="../../">Camp Resources</a> / <a href="../">IBO Practical Tools</a> / Tree Builder</nav>

    <h1>Tree Builder</h1>
    <section class="panel" aria-label="Tree Builder inputs">
      <label for="alignment-input">Alignment</label>
      <textarea id="alignment-input" spellcheck="false"></textarea>
      <div class="buttons">
        <button type="button" id="run-tool">Build tree</button>
        <button type="button" class="secondary" id="clear-tool">Clear</button>
        <button type="button" class="secondary" id="copy-results">Copy results</button>
      </div>
<div id="tool-message" class="message" role="status" aria-live="polite"></div>
    </section>
    <section id="tool-results" class="panel" style="display: none;" aria-label="Tree Builder results">
      <h2>Tree</h2>
      <div id="summary" class="summary-grid"></div>
      <h3>Newick</h3>
      <div id="tree-newick" class="output-block"></div>
      <h3>Visual Diagram</h3>
      <div id="tree-diagram" class="tree-diagram"></div>
    </section>

    <script src="../../../assets/biopython-tools.js"></script>
  </main>
</body>
</html>
