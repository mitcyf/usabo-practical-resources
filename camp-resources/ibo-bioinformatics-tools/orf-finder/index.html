<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORF Finder | USABO Practical Resources</title>
  <link rel="stylesheet" href="../../../assets/site.css?v=proctor-stripes-3">
  <script defer src="../../../assets/site-stripes.js?v=proctor-stripes-3"></script>
</head>
<body data-py-tool="orf-finder">
  <main class="site-shell">
    <header class="site-header">
      <p class="site-title"><a href="../../../">USABO Practical Resources</a></p>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="../../../camp-resources/">Camp Resources</a>
        <a href="../../../plant-computation-biology/">Plant Computation Biology</a>
      </nav>
    </header>

    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../../../">Home</a> / <a href="../../">Camp Resources</a> / <a href="../">IBO Practical Tools</a> / ORF Finder</nav>

    <h1>ORF Finder</h1>
    <section class="panel" aria-label="ORF Finder inputs">
      <label for="sequence-input">DNA FASTA sequence</label>
      <textarea id="sequence-input" spellcheck="false"></textarea>
      <div class="settings three">
        <div>
          <label for="min-orf-length">Minimum ORF length (aa)</label>
          <input id="min-orf-length" type="number" value="30" min="1" step="1">
        </div>
        <div>
          <label for="genetic-code">Genetic code</label>
          <select id="genetic-code">
            <option value="1">1 - The Standard Code</option>
            <option value="2">2 - The Vertebrate Mitochondrial Code</option>
            <option value="3">3 - The Yeast Mitochondrial Code</option>
            <option value="5">5 - The Invertebrate Mitochondrial Code</option>
          </select>
        </div>
        <div>
          <label for="strand-mode">Strands</label>
          <select id="strand-mode">
            <option value="forward">Forward only</option>
            <option value="both">Forward and reverse complement</option>
          </select>
        </div>
      </div>
      <div class="status-row">
        <label><input id="hide-contained" type="checkbox" checked style="width: auto; margin-right: 6px;"> Hide ORFs contained within longer ORFs in the same frame</label>
      </div>
      <div class="buttons">
        <button type="button" id="run-tool">Find ORFs</button>
        <button type="button" class="secondary" id="clear-tool">Clear</button>
        <button type="button" class="secondary" id="copy-results">Copy results</button>
      </div>
<div id="tool-message" class="message" role="status" aria-live="polite"></div>
    </section>
    <section id="tool-results" class="panel" style="display: none;" aria-label="ORF Finder results">
      <h2>Candidate ORFs</h2>
      <div id="summary" class="summary-grid"></div>
      <div id="result-table"></div>
    </section>

    <script src="../../../assets/biopython-tools.js"></script>
  </main>
</body>
</html>
